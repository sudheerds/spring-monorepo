plugins {
    id 'java-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.example.services.order'
version = '1.0.0'

dependencies {
    implementation libs.spring.boot.starter.web
    implementation project(':libraries:platform-observability')
    implementation project(':libraries:platform-security')
    implementation project(':libraries:platform-exceptions')
    implementation project(':libraries:platform-client')
    implementation project(':libraries:platform-jpa')
    runtimeOnly libs.postgresql
    testRuntimeOnly libs.h2

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testImplementation libs.spring.boot.starter.test
}
