plugins {
    id 'java-library'   // ✅ Correct for shared libraries
    id 'io.spring.dependency-management'
}

group = 'com.example.platform'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // ✅ Use the full accessor name as defined in libs.versions.toml
    api libs.spring.boot.starter.web
    api libs.spring.boot.starter.actuator 
    api libs.micrometer.prometheus
    api libs.spring.boot.starter.aspectj
    api libs.logstash.logback.encoder   
    api libs.micrometer.tracing.bridge.otel
    api libs.opentelemetry.exporter.otlp
    annotationProcessor libs.spring.boot.config.processor
    compileOnly libs.spring.boot.config.processor
}
